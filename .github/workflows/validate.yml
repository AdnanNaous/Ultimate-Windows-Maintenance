name: Validate

on:
  pull_request:
    paths-ignore: ["**/*.md", "**/*.pdf"]
  push:
    paths-ignore: ["**/*.md", "**/*.pdf"]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse PowerShell without executing maintenance
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $failures += $parseErrors
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
          Get-Content Config.json -Raw | ConvertFrom-Json | Out-Null
